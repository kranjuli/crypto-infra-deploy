events {}

http {
    # Basic settings
    sendfile on;
    keepalive_timeout 65;

    # Upstream definitions (cleaner and reusable)
    upstream trade_vista {
        server trade-vista:8080;
    }

    upstream crypto_tracker {
        server crypto-tracker:8000;
    }

    server {
        listen 80;

        # --- Trade-Vista ---
        location /trade-vista/ {
            proxy_pass http://trade_vista/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Optional: fix for apps that need correct base path
            # proxy_redirect off;
        }

        # --- Crypto-Tracker ---
        location /crypto/ {
            proxy_pass http://crypto_tracker/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_redirect off;
        }

        # --- Root redirect ---
        location = / {
            return 302 /trade-vista/;
        }

        # --- Health check endpoint ---
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
            access_log off;
        }
    }
}
