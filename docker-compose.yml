services:
  crypto-tracker:
    image: crypto-tracker:latest
    volumes:
      - ${CRYPTO_TRACKER_DATA_ROOT}:/app/data
    container_name: crypto-tracker
    ports:
      - "8000:8000"

  trade-vista:
    image: trade-vista:latest
    container_name: trade-vista
    volumes:
      - ${TRADE_VISTA_TRANSACTIONS_ROOT}:/app/transactions:ro
    ports:
      - "8080:8080"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crypto-tracker
      - trade-vista
